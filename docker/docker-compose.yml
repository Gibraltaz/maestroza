services:

  maestrozo-backend:
    container_name: maestrozo-backend
    image: maestrozo_backend
    ports:
      - "9101:9101"
    networks:
      - maestrozo-network
    restart: always


  maestrozo-frontend:
    container_name: maestrozo-frontend
    image: maestrozo_frontend
    ports:
      - "80:8080"
    networks:
      - maestrozo-network
    restart: always


networks:
  maestrozo-network:
