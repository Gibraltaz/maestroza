services:

  maestrozo-backend:
    container_name: maestrozo-backend
    image: maestrozo_backend
    ports:
      - "${MAESTROZO_DOCKER_BACKEND_PORT:-9101}:9101"
    networks:
      - maestrozo-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always


  maestrozo-frontend:
    container_name: maestrozo-frontend
    image: maestrozo_frontend
    ports:
      - "${MAESTROZO_DOCKER_FRONTEND_PORT:-80}:8080"
    networks:
      - maestrozo-network
    restart: always


networks:
  maestrozo-network:
